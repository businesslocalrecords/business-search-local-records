# Auto-deploy the funnel to Network Solutions (domain.com) on every push to main.
#
# This repolishes the static site at /prototype2/ on the shared host.
# It NEVER touches /api (PHP backend), /thanks.html at root, /uet.js, /gtag.js,
# or the per-city archive boards — those live outside this repo.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     e.g. ftp.businesslocalrecords.com
#   FTP_USERNAME   cPanel/host FTP user
#   FTP_PASSWORD   FTP password
# Optional repository Variable (…→ Variables → New repository variable):
#   FTP_SERVER_DIR default "public_html/prototype2/"  (change if the app maps elsewhere)
#
# NOTE: Some Network Solutions plans allowlist FTP source IPs. If GitHub Actions
# runners are blocked, use the manual fallback scripts/deploy.sh, or switch to the
# SFTP variant noted at the bottom of this file.

name: Deploy to Network Solutions

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "build_board.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prototype2
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site to /prototype2 via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp                 # use "ftps" if the host supports FTP-over-TLS
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/prototype2/' }}
          dangerous-clean-slate: false  # additive deploy; never wipe other files
          exclude: |
            **/.git*
            **/.github/**
            **/.kilo/**
            **/__pycache__/**
            **/scripts/**
            **/screenshots/**
            **/prototype3/**
            **/*.py
            **/*.md
            **/*.png
            **/public/data/**

      - name: Smoke check — pages are live
        run: |
          set -e
          for p in "prototype2/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://businesslocalrecords.com/${p}")
            echo "GET ${p} -> ${code}"
            [ "$code" = "200" ] || { echo "Smoke check failed for ${p}"; exit 1; }
          done
          echo "Deploy OK — site is live."

